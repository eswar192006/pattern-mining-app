# Executive modern dark theme
[theme]
base = "dark"
primaryColor = "#6366F1"
backgroundColor = "#0B0F19"
secondaryBackgroundColor = "#151D2E"
textColor = "#F8FAFC"
borderColor = "#26334D"
font = "sans serif"
showWidgetBorder = true
showSidebarBorder = true

[browser]
gatherUsageStats = false

[server]
headless = true
runOnSave = true
